<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="1280" height="720">
  <!-- Schéma anatomique : hernie diaphragmatique congénitale gauche.
       Nouveau-né vu de face, coupé aux hanches. Sa gauche est à droite de l'image. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f3f1"/>
      <stop offset="1" stop-color="#fdfbfa"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ecc9b4"/>
      <stop offset="0.25" stop-color="#f6dccd"/>
      <stop offset="0.75" stop-color="#f6dccd"/>
      <stop offset="1" stop-color="#ecc9b4"/>
    </linearGradient>
    <radialGradient id="face" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0.6" stop-color="#f6dccd"/>
      <stop offset="1" stop-color="#ecc9b4"/>
    </radialGradient>
    <!-- Dégradés des organes : clair au centre, plus foncé sur les bords -->
    <radialGradient id="lung" cx="0.45" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#f7cfd0"/><stop offset="1" stop-color="#e4a3aa"/>
    </radialGradient>
    <radialGradient id="heart" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#e46e66"/><stop offset="1" stop-color="#b8443f"/>
    </radialGradient>
    <radialGradient id="liver" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#c98068"/><stop offset="1" stop-color="#9c5442"/>
    </radialGradient>
    <radialGradient id="stomach" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#f6c4a6"/><stop offset="1" stop-color="#dc9a74"/>
    </radialGradient>
    <linearGradient id="muscle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d27470"/><stop offset="1" stop-color="#b75a57"/>
    </linearGradient>
    <path id="trunk" d="M302,126 C300,140 292,146 278,150 C260,155 246,160 240,172
             C233,190 233,220 236,250 C240,282 242,322 240,372 L400,372
             C398,322 400,282 404,250 C407,220 407,190 400,172 C394,160 380,155 362,150
             C348,146 340,140 338,126 Z"/>
    <clipPath id="trunkClip"><use href="#trunk"/></clipPath>
  </defs>

  <rect width="640" height="360" fill="url(#bg)"/>

  <!-- Bras le long du corps -->
  <g fill="url(#skin)" stroke="#d6a88f" stroke-width="1.6">
    <path d="M246,164 C226,170 214,196 212,232 C210,268 207,320 206,372 L238,372 C238,330 239,290 240,258 Z"/>
    <path d="M394,164 C414,170 426,196 428,232 C430,268 433,320 434,372 L402,372 C402,330 401,290 400,258 Z"/>
  </g>

  <!-- Tronc -->
  <use href="#trunk" fill="url(#skin)" stroke="#d6a88f" stroke-width="1.6"/>

  <g clip-path="url(#trunkClip)">
    <!-- Cavité intérieure, très légèrement plus sombre -->
    <path d="M250,170 C268,160 372,160 390,170 C398,220 398,300 394,372 L246,372 C242,300 242,220 250,170 Z"
          fill="#efd2c4" opacity="0.6"/>

    <!-- ===== Abdomen ===== -->
    <!-- Côlon ascendant (gros intestin), à droite du bébé -->
    <g fill="none" stroke-linecap="round">
      <path d="M258,368 C256,340 256,318 262,300" stroke="#c99178" stroke-width="15"/>
      <path d="M258,368 C256,340 256,318 262,300" stroke="#e6b79f" stroke-width="12"/>
      <g stroke="#c99178" stroke-width="1.2">
        <path d="M251,350 L264,351"/><path d="M251,336 L264,337"/><path d="M252,322 L266,323"/><path d="M255,309 L268,311"/>
      </g>
    </g>

    <!-- Intestin grêle : pelote de boucles (tube = bord foncé + intérieur clair + reflet) -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <g id="coils">
        <!-- Un seul long tube qui serpente et se replie, comme l'intestin grêle -->
        <path d="M352,298 C340,296 330,300 324,310 C318,320 304,318 298,308 C292,298 276,302 274,314
                 C272,326 288,330 296,326 C306,322 314,330 310,340 C306,350 290,346 282,338
                 C274,330 264,340 268,352 C272,364 290,364 296,356 C302,348 318,350 322,360
                 C326,370 344,370 348,360 C352,350 340,340 332,336 C322,332 326,318 338,318
                 C350,318 356,330 366,330 C378,330 386,320 380,310 C374,300 362,306 366,318
                 C370,330 388,340 386,354 C384,366 368,368 362,360"/>
      </g>
      <use href="#coils" stroke="#cf8c8c" stroke-width="10"/>
      <use href="#coils" stroke="#efb9b6" stroke-width="7"/>
      <use href="#coils" stroke="#fbe1de" stroke-width="1.6" transform="translate(-1.5,-1.5)" opacity="0.9"/>
    </g>

    <!-- Foie : sous le dôme droit du diaphragme -->
    <path d="M242,268 C256,254 276,247 295,250 C312,253 326,258 342,260 C350,262 352,268 346,274
             C330,284 300,294 276,300 C258,304 244,298 240,286 C238,278 239,272 242,268 Z"
          fill="url(#liver)" stroke="#8e4b3b" stroke-width="1.2"/>
    <path d="M300,253 C302,266 300,282 296,296" fill="none" stroke="#8e4b3b" stroke-width="1" opacity="0.7"/>
    <path d="M258,262 C270,258 284,256 296,258" fill="none" stroke="#e3a48c" stroke-width="2" opacity="0.5"/>

    <!-- Diaphragme : muscle en dôme, avec un trou à gauche du bébé.
         Dessiné avant le thorax pour que le cœur et l'estomac passent devant. -->
    <path d="M240,262 C255,248 275,240 295,244 C310,247 324,252 342,252 L342,258
             C324,258 310,253 295,250 C275,246 257,254 242,268 Z" fill="url(#muscle)" stroke="#9e4a48" stroke-width="0.8"/>
    <path d="M382,250 C390,250 398,255 404,263 L402,269 C396,261 389,256 382,256 Z"
          fill="url(#muscle)" stroke="#9e4a48" stroke-width="0.8"/>

    <!-- ===== Thorax ===== -->
    <!-- Trachée et bronches, déviées vers la droite du bébé -->
    <g fill="none" stroke-linecap="round">
      <path d="M321,128 C320,150 318,166 314,180 M314,180 C306,186 298,190 290,196 M314,180 C324,186 340,190 352,196"
            stroke="#d6b4a4" stroke-width="9"/>
      <path d="M321,128 C320,150 318,166 314,180 M314,180 C306,186 298,190 290,196 M314,180 C324,186 340,190 352,196"
            stroke="#eedcd2" stroke-width="6.5"/>
      <g stroke="#d6b4a4" stroke-width="1.1">
        <path d="M317,136 L325,136"/><path d="M317,143 L324,143"/><path d="M316,150 L324,150"/>
        <path d="M315,157 L323,157"/><path d="M314,164 L322,164"/><path d="M312,171 L320,171"/>
      </g>
    </g>

    <!-- Poumon droit : presque normal, 3 lobes -->
    <path d="M268,172 C256,174 248,190 245,212 C242,232 242,250 244,260 C256,250 274,243 292,246
             C296,236 294,224 290,214 C288,200 284,190 280,180 C277,174 273,171 268,172 Z"
          fill="url(#lung)" stroke="#c98790" stroke-width="1.2"/>
    <g fill="none" stroke="#c98790" stroke-width="1">
      <path d="M247,214 C262,211 276,214 289,211"/>
      <path d="M250,247 C262,232 276,218 286,200"/>
    </g>
    <g fill="#e8a9b0" opacity="0.35">
      <circle cx="258" cy="196" r="2"/><circle cx="268" cy="226" r="2.2"/><circle cx="256" cy="236" r="1.8"/><circle cx="276" cy="200" r="1.6"/>
    </g>

    <!-- Poumon gauche : petit et écrasé (hypoplasique) -->
    <path d="M362,176 C356,180 352,190 354,200 C362,198 372,197 380,200 C384,192 382,182 376,177
             C372,174 366,173 362,176 Z" fill="url(#lung)" stroke="#c98790" stroke-width="1.2"/>

    <!-- Cœur, déplacé vers la droite du bébé, avec les gros vaisseaux -->
    <g fill="none" stroke-linecap="round">
      <path d="M287,198 L286,172" stroke="#6f7db3" stroke-width="8"/>
      <path d="M303,199 C301,184 312,176 323,180 C330,183 333,190 333,198" stroke="#c9423f" stroke-width="8"/>
      <path d="M311,202 C314,193 321,190 327,194" stroke="#8678b8" stroke-width="6.5"/>
    </g>
    <path d="M288,195 C272,196 262,208 263,224 C264,240 280,254 318,260 C326,252 332,236 330,222
             C328,206 316,196 302,196 C298,195 292,195 288,195 Z"
          fill="url(#heart)" stroke="#963733" stroke-width="1.2"/>
    <g fill="none" stroke="#963733" stroke-width="1" opacity="0.7">
      <path d="M268,220 C282,224 298,232 314,250"/>
      <path d="M306,204 C310,220 314,238 318,256"/>
    </g>
    <path d="M276,208 C282,203 290,201 296,202" fill="none" stroke="#f29b93" stroke-width="2" opacity="0.6"/>

    <!-- Intestin qui remonte par le trou, collé au cœur -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path id="herniated" d="M352,298 C346,284 356,274 352,262 C348,250 334,250 334,238
               C334,226 350,226 352,236 C354,246 342,250 340,242 M356,262 C364,252 362,242 352,232"/>
      <use href="#herniated" stroke="#cf8c8c" stroke-width="10"/>
      <use href="#herniated" stroke="#efb9b6" stroke-width="7"/>
      <use href="#herniated" stroke="#fbe1de" stroke-width="1.6" transform="translate(-1.5,-1.5)" opacity="0.9"/>
    </g>

    <!-- Estomac remonté dans le thorax, avec ses plis -->
    <path d="M362,214 C366,204 382,202 390,212 C398,222 398,240 392,252 C386,262 374,268 362,268
             C356,268 352,262 354,256 C358,246 360,236 356,228 C354,222 358,218 362,214 Z"
          fill="url(#stomach)" stroke="#b97650" stroke-width="1.2"/>
    <g fill="none" stroke="#c98660" stroke-width="0.9" opacity="0.7">
      <path d="M366,222 C374,228 380,240 382,252"/>
      <path d="M372,214 C380,222 386,234 388,246"/>
      <path d="M362,232 C368,240 372,250 372,260"/>
    </g>
    <!-- Rate, elle aussi remontée -->
    <path d="M392,230 C400,230 405,241 401,252 C398,259 391,257 392,250 C393,244 389,237 392,230 Z"
          fill="#9c6283" stroke="#7a4565" stroke-width="1"/>

    <!-- Cage thoracique en transparence -->
    <g fill="none" stroke="#b98f7c" stroke-width="2.2" stroke-linecap="round" opacity="0.18">
      <path d="M320,168 L320,250"/>
      <path d="M318,178 C296,174 266,178 250,192"/><path d="M322,178 C344,174 374,178 390,192"/>
      <path d="M318,194 C294,190 264,196 248,212"/><path d="M322,194 C346,190 376,196 392,212"/>
      <path d="M318,210 C294,208 262,216 246,234"/><path d="M322,210 C346,208 378,216 394,234"/>
      <path d="M318,226 C294,226 262,236 246,254"/><path d="M322,226 C346,226 378,236 394,254"/>
    </g>
    <!-- Clavicules -->
    <g fill="none" stroke="#c9a08b" stroke-width="2" stroke-linecap="round" opacity="0.5">
      <path d="M262,166 C280,170 298,168 312,160"/><path d="M378,166 C360,170 342,168 328,160"/>
    </g>
  </g>

  <!-- Cou et tête -->
  <path d="M302,112 L302,130 C310,136 330,136 338,130 L338,112 Z" fill="#efcfbc"/>
  <ellipse cx="272" cy="76" rx="7" ry="11" fill="#f0d0bd" stroke="#d6a88f" stroke-width="1.4"/>
  <ellipse cx="368" cy="76" rx="7" ry="11" fill="#f0d0bd" stroke="#d6a88f" stroke-width="1.4"/>
  <ellipse cx="320" cy="70" rx="49" ry="56" fill="url(#face)" stroke="#d6a88f" stroke-width="1.6"/>
  <g fill="none" stroke="#b8896f" stroke-width="1.4" stroke-linecap="round" opacity="0.8">
    <path d="M300,20 C306,26 308,32 306,38"/><path d="M314,17 C318,24 320,30 317,37"/>
    <path d="M328,18 C330,25 330,31 326,37"/><path d="M341,22 C340,28 338,33 334,38"/>
  </g>
  <g fill="none" stroke-linecap="round">
    <path d="M296,76 Q303,79 310,76" stroke="#8b6656" stroke-width="1.6"/>
    <path d="M330,76 Q337,79 344,76" stroke="#8b6656" stroke-width="1.6"/>
    <path d="M318,88 Q320,93 323,90" stroke="#cf9f88" stroke-width="1.5"/>
    <path d="M314,103 Q320,106 326,103" stroke="#c98477" stroke-width="1.7"/>
  </g>
</svg>
